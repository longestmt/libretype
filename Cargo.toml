# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "libretypist"
version = "1.0.0"
edition = "2021"
default-run = "libretype"
description = "A local, subscription-free macOS typing assistant"
license = "GPL-3.0-only"

[[bin]]
name = "libretype"
path = "src/main.rs"

[[bin]]
name = "libretype-docs-bridge"
path = "src/docs_host.rs"

[dependencies]
libc = "0.2"
ring = "0.17.14"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2.5.8"
unicode-width = { version = "=0.2.2", default-features = false }
curl = { version = "0.4.51", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
core-foundation = "0.10"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
objc = { path = "vendor/objc" }
